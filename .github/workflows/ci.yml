name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Ensures Anthropic is never required; reasoner paths are mocked/tested without keys.
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest suite (mocked Anthropic; no secrets)
        run: |
          pytest -q --cov=src --cov-report=term-missing tests/
      - name: Smoke validate known-answer scenarios (13/13 diagnosis)
        run: |
          PYTHONPATH=src python scripts/run_validation.py
