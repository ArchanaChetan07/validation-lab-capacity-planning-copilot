services:
  api:
    build: .
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      - PORT=8000
      # Leave ANTHROPIC_API_KEY unset for local demos; /ask still returns
      # grounded simulation numbers with a reasoner fallback message.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
